<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="theme-color" content="#111111">

<title>DUCK Live — الشاشات 1–284</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#111111;--card:#292929;--el:#353535;--pr:#d4af37;--pr2:#b87936;--tq:#e6c766;--gold:#ffc857;--ok:#3ddc97;--warn:#ffb020;--err:#ff5470;--tx:#f5e6c8;--tx2:#b9a98a;--bd:#d4af3733;--grad:linear-gradient(135deg,#e6c766,#d4af37 45%,#b87936);box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050505;color:var(--tx);font-family:Cairo,"IBM Plex Sans Arabic",system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;height:100%;max-width:390px;max-height:844px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:500px){#app{border-radius:40px;border:8px solid #292929;box-shadow:0 0 80px #d4af3744}}
.scr{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 20px;animation:in .3s}
.scr::-webkit-scrollbar{display:none}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
svg{flex:none;display:block}
.btn{height:52px;border-radius:999px;width:100%;background:var(--grad);font-weight:700;font-size:16px;box-shadow:0 6px 22px #d4af3755;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn:active{transform:scale(.97)}.btn.ghost{background:var(--el);box-shadow:none;font-weight:600;font-size:14px}.btn:disabled{opacity:.4;box-shadow:none}
.inp{height:52px;border-radius:12px;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 14px;margin-bottom:12px;color:var(--tx2)}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:15px}
.inp:focus-within{border-color:var(--pr);box-shadow:0 0 0 3px #d4af3733}
h1{font-size:26px;font-weight:800}h2{font-size:17px;font-weight:700}.mut{color:var(--tx2);font-size:13px}
.av{border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;color:#fff}
.card{background:var(--card);border-radius:16px;border:1px solid var(--bd)}
.rb{width:40px;height:40px;border-radius:50%;background:var(--el);display:grid;place-items:center;flex:none}
.nav{display:flex;align-items:center;justify-content:space-around;background:#1b1b1b;border-top:1px solid var(--bd);padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--tx2);min-width:60px;min-height:44px;text-align:center}
.nav .on{color:#fff}.nav .on svg{stroke:var(--pr2);filter:drop-shadow(0 0 6px #d4af37)}
.nav .plus{width:54px;height:54px;border-radius:50%;background:var(--grad);display:grid;place-items:center;margin-top:-24px;min-width:0;box-shadow:0 6px 22px #d4af37aa;color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0}.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid var(--bd);font-size:13px;white-space:nowrap;min-height:38px;display:inline-flex;align-items:center;gap:6px;text-align:center}
.chip.on{background:var(--pr);border-color:var(--pr)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cov{position:relative;overflow:hidden;display:grid;place-items:center;color:#fff}
.cov .bg{position:absolute;opacity:.22;transform:scale(2.6)}
.cov:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,#ffffff33,transparent 50%)}
.room{height:178px;border-radius:20px;position:relative;overflow:hidden;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.room:active{transform:scale(.97)}.room:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000c)}
.room>*{position:relative;z-index:1}.room .bg{position:absolute;top:26px;left:50%;margin-left:-32px;opacity:.28;z-index:0}
.live{display:inline-flex;gap:5px;align-items:center;background:var(--err);font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px}
.live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.25;transform:scale(1.7)}}
.rowc{display:flex;gap:12px;align-items:center;padding:10px;margin-bottom:10px;width:100%}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.ov{position:absolute;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:20;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sh{width:100%;background:var(--card);border-radius:28px 28px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 18px);animation:up .3s;max-height:85%;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}}
.hd{width:44px;height:4px;border-radius:9px;background:var(--bd);margin:0 auto 14px}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin:12px 0;overflow-x:auto}.tabs button{flex:1;padding:10px 12px;color:var(--tx2);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;text-align:center;transition:.2s}.tabs .on{color:#fff;border-color:var(--pr)}
.sk{background:linear-gradient(90deg,var(--card),var(--el),var(--card));background-size:200% 100%;animation:shm 1.2s infinite;border-radius:16px}
@keyframes shm{to{background-position:-200% 0}}
.bn{display:flex;gap:10px;align-items:center;background:#ffffff10;border:1px solid currentColor;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.rg{position:absolute;inset:0;border-radius:50%;border:2px solid #d4af37;animation:rg 2.4s infinite;opacity:0}
@keyframes rg{from{transform:scale(.55);opacity:.8}to{transform:scale(1.15);opacity:0}}
.ld{display:block;height:100%;width:40%;background:var(--grad);border-radius:9px;animation:ldm 1.3s infinite}
@keyframes ldm{from{margin-right:-40%}to{margin-right:100%}}
.tg{width:46px;height:28px;border-radius:99px;background:var(--bd);position:relative;flex:none;transition:.2s}.tg:after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--pr)}.tg.on:after{right:21px}
.rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);flex:none;display:grid;place-items:center}.rd.on{border-color:var(--pr)}.rd.on:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pr)}
mark{background:#d4af3766;color:#fff;border-radius:4px;padding:0 2px}
.toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;background:var(--el);border:1px solid var(--pr);border-radius:14px;padding:12px;text-align:center;z-index:50;font-size:14px;animation:in .3s}
.mn{position:absolute;bottom:92px;left:10px;z-index:60;width:40px;height:40px;border-radius:50%;background:#d4af37cc;display:grid;place-items:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.btn{color:#111111}.btn.ghost{color:#fff}.chip.on{color:#111111;font-weight:700}.nav .plus,.mn{color:#111111}.mn svg{stroke:#111111}
[style*="background:var(--pr)"]{color:#111111}mark{color:#fff;background:#d4af3755}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;position:relative;text-align:center}
.seat .av{border:2px solid transparent;position:relative}.seat.sp .av{border-color:var(--tq);animation:glow 1.1s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px #19d3c522,0 0 20px #19d3c5}}
.seat.emp .av,.seat.lk .av{border:2px dashed var(--bd);background:var(--card);color:var(--tx2)}
.seat .n{position:absolute;top:-2px;right:6px;background:var(--el);border-radius:99px;font-size:10px;min-width:18px;height:18px;display:grid;place-items:center;z-index:2}
.mt{position:absolute;bottom:16px;right:6px;background:var(--err);border-radius:50%;width:20px;height:20px;display:grid;place-items:center}
.ctl{display:flex;align-items:center;gap:10px;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);background:#1b1b1b;border-top:1px solid var(--bd)}
.ctl .t{flex:1;height:44px;border-radius:99px;background:var(--el);padding:0 16px;display:flex;align-items:center;color:var(--tx2);font-size:13px}
.rb.tq{background:var(--tq);color:#00312e}.rb.g{background:linear-gradient(135deg,#FFD84D,#FFA800);color:#111111}.rb.big{width:46px;height:46px}
.msg{display:flex;gap:8px;align-items:flex-start;font-size:13px}.msg p{background:#ffffff12;padding:7px 12px;border-radius:4px 14px 14px 14px;margin-top:2px}
.sys{text-align:center;color:var(--tx2);font-size:12px;font-style:italic}
.spin{width:34px;height:34px;border:4px solid var(--bd);border-top-color:var(--pr);border-radius:50%;animation:sp 1s linear infinite;margin:12px auto}@keyframes sp{to{transform:rotate(360deg)}}
.ev{height:150px;border-radius:20px;padding:14px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:14px}.ev:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,#000b)}.ev>*{position:relative;z-index:1}.ev .bg{position:absolute;top:14px;left:14px;opacity:.25;z-index:0}
.cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--bd);display:grid;place-items:center;flex:none}.cb.on{background:var(--pr);border-color:var(--pr);color:#111111}
.gfly{position:absolute;left:50%;top:70%;margin-left:-48px;animation:gf 2.6s ease-out forwards}@keyframes gf{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translateY(-330px) scale(1.4);opacity:0}}.spk{position:absolute;top:40%;width:8px;height:8px;border-radius:2px;background:var(--pr);opacity:0;animation:sp2 1.6s ease-out forwards}@keyframes sp2{30%{opacity:1}to{transform:translateY(-70px) rotate(180deg);opacity:0}}.gpl{animation:gp 1.2s infinite}@keyframes gp{50%{transform:scale(1.12) rotate(5deg)}}
.btn.dg{background:var(--err);color:#fff;box-shadow:none}
.mn{z-index:60}
#app.wide{max-width:1180px;max-height:820px}
@media(min-width:500px){#app.wide{border-radius:18px}}
.adtop{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
.adw{flex:1;display:flex;min-height:0}
.ads{width:190px;flex:none;overflow-y:auto;padding:10px;border-inline-end:1px solid var(--bd);display:flex;flex-direction:column;gap:4px}
.ads button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--tx2);font-size:14px;text-align:start}
.ads button.on{background:var(--el);color:#fff;font-weight:700}
.adc{flex:1;overflow:auto;padding:18px;min-width:0}
.adg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}
.adt{width:100%;border-collapse:collapse;font-size:13px}
.adt th{background:var(--card);text-align:start;padding:10px 12px;color:var(--tx2);font-weight:600;white-space:nowrap}
.adt td{padding:10px 12px;border-top:1px solid var(--bd);vertical-align:middle}
.ac{display:flex;gap:6px;flex-wrap:wrap}
.adb{padding:6px 12px;border-radius:9px;background:var(--el);border:1px solid var(--bd);color:#fff;font-size:12px;white-space:nowrap;min-height:32px}
.adb.dg{color:var(--err);border-color:var(--err)}.adb.wn{color:var(--warn);border-color:var(--warn)}
.mdl{position:absolute;inset:0;background:#000a;display:grid;place-items:center;z-index:70;padding:16px}
.mdb{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:90%;overflow:auto}
.amt{width:100%;min-height:76px;border-radius:12px;background:var(--bg);border:1px solid var(--bd);color:#fff;padding:10px;font:inherit;margin-bottom:6px}
.adlg{flex:1;display:grid;place-items:center;padding:16px;overflow:auto}
@media(max-width:700px){.adw{flex-direction:column}.ads{width:auto;flex-direction:row;border-inline-end:0;border-bottom:1px solid var(--bd);padding:6px}.ads button{white-space:nowrap}}

login:()=>{const l=S.ls||0,er=l==1;return `<div class="scr"><div style="text-align:center;margin:8px 0 16px">${logo(56)}<h1 style="margin-top:12px">أهلًا بعودتك</h1></div>${sw('ls',['عادي','بيانات خاطئة','غير موثّق','قفل مؤقت'])}${l==2?`<div class="bn" style="color:var(--warn)">${ic('warn',18)}<span style="flex:1;color:#fff">حسابك غير موثّق</span><b style="color:var(--tq)">تحقق الآن</b></div>`:''}${l==3?`<div class="bn" style="color:var(--err)">${ic('lock',18)}<span style="color:#fff">محاولات كثيرة، أعد المحاولة بعد 02:00</span></div>`:''}${fld('phone','رقم الهاتف أو البريد الإلكتروني',er?'بيانات غير صحيحة':0)}${fld('lock','كلمة المرور',er?'تحقق من كلمة المرور':0,'password','',1)}<button style="color:var(--tq);font-size:13px;margin-bottom:16px" onclick="go('forgot')">نسيت كلمة المرور؟</button><button class="btn" ${l==3?'disabled':''} onclick="tab('home')">تسجيل الدخول</button><div style="display:flex;align-items:center;gap:10px;margin:16px 0" class="mut"><i style="flex:1;height:1px;background:var(--bd)"></i>أو<i style="flex:1;height:1px;background:var(--bd)"></i></div><div style="display:flex;gap:10px"><button class="btn ghost" style="height:48px">Google</button><button class="btn ghost" style="height:48px">Apple</button></div><p class="mut" style="text-align:center;margin-top:16px">ليس لديك حساب؟ <b style="color:var(--tq)" onclick="go('reg')">إنشاء حساب</b></p></div>`},
reg:()=>{const r=S.rs||0,q=(t,ok)=>`<div style="font-size:12px;color:${ok?'var(--ok)':'var(--tx2)'};display:flex;gap:6px;align-items:center">${ic(ok?'check':'dots',14)}${t}</div>`;return `<div class="scr">${hd('إنشاء حساب','welcome')}${sw('rs',['فارغ','أخطاء','جاهز'])}${fld('user','الاسم أو اسم العرض',0,'text',r==2?'سامي':'')}${fld('phone','رقم الهاتف أو البريد',r==1?'صيغة غير صحيحة':0,'text',r==2?'sami@mail.com':r==1?'123':'')}${fld('lock','كلمة المرور',r==1?'كلمة المرور ضعيفة':0,'password',r==2?'Aa123456':'',1)}<div style="margin:0 4px 12px;display:grid;gap:3px">${q('٨ أحرف على الأقل',r==2)}${q('حرف كبير',r==2)}${q('رقم',r==2)}</div>${fld('lock','تأكيد كلمة المرور',r==1?'غير متطابقة':0,'password',r==2?'Aa123456':'')}<p class="mut" style="margin:6px 0 16px;display:flex;gap:8px;align-items:center"><span class="rd ${r==2?'on':''}" style="border-radius:6px"></span>أوافق على <b style="color:var(--tq)">الشروط</b> و<b style="color:var(--tq)">سياسة الخصوصية</b></p><button class="btn" ${r==2?'':'disabled'} onclick="go('otp')">إنشاء حساب</button></div>`},
otp:()=>{const c=S.code||'',bad=c.length==6&&c!='123456',ok=c=='123456';return `<div class="scr" style="display:flex;flex-direction:column"><div style="text-align:center"><div class="av" style="width:72px;height:72px;margin:auto;background:${ok?'#3ddc9733':'var(--el)'};color:${ok?'var(--ok)':'var(--pr2)'}">${ic(ok?'check':'mail',34)}</div><h1 style="font-size:22px;margin-top:10px">${ok?'تم التحقق':'أدخل رمز التحقق'}</h1><p class="mut" style="margin:8px 0">أرسلنا رمزًا إلى +20 1XX XXX XXXX <b style="color:var(--tq)">تعديل</b></p><p class="mut">جرّب الرمز 123456</p></div><div style="display:flex;gap:8px;justify-content:center;margin:18px 0" dir="ltr">${[0,1,2,3,4,5].map(i=>`<div style="width:46px;height:56px;border-radius:12px;background:var(--card);border:1.5px solid ${bad?'var(--err)':ok?'var(--ok)':c.length==i?'var(--pr)':'var(--bd)'};display:grid;place-items:center;font-size:22px;font-weight:700">${c[i]||''}</div>`).join('')}</div>${bad?'<p style="color:var(--err);text-align:center;font-size:13px">الرمز غير صحيح</p>':`<p class="mut" style="text-align:center">إعادة الإرسال بعد 00:45</p>`}<div style="flex:1"></div>${ok?`<button class="btn" onclick="S.code='';go('email')">متابعة</button>`:`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px" dir="ltr">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button class="rb" style="width:100%;border-radius:14px;height:50px;font-size:20px;justify-content:center;${k===''?'visibility:hidden':''}" onclick="S.code=${k==='⌫'?`(S.code||'').slice(0,-1)`:`((${bad}?'':S.code||'')+'${k}').slice(0,6)`};draw()">${k}</button>`).join('')}</div>`}</div>`},
email:()=>{const o=S.ev;return `<div class="scr" style="text-align:center;padding-top:50px"><div class="av" style="width:96px;height:96px;margin:auto;background:${o?'#3ddc9733':'var(--el)'};color:${o?'var(--ok)':'var(--pr2)'}">${ic(o?'check':'mail',44)}</div><h1 style="font-size:22px;margin:14px 0 8px">${o?'تم التحقق من بريدك':'تحقق من بريدك'}</h1><p class="mut">أرسلنا رسالة إلى</p><b style="display:block;margin:6px 0 22px;color:var(--tq)" dir="ltr">sami@mail.com</b>${o?`<button class="btn" onclick="S.ev=0;go('username')">متابعة</button>`:`<button class="btn" onclick="toast('فتح تطبيق البريد')">فتح تطبيق البريد</button><button class="btn ghost" style="margin:10px 0">إعادة إرسال (00:30)</button><button style="color:var(--tq);margin:auto;display:block" onclick="go('reg')">تغيير البريد</button><p class="mut" style="margin-top:18px">لا يُعتبر البريد موثقًا إلا بعد التحقق.</p><button class="chip" style="margin-top:12px" onclick="S.ev=1;draw()">محاكاة نجاح التحقق</button>`}</div>`},
forgot:()=>{const f=S.fg||0;return `<div class="scr">${hd('استعادة كلمة المرور','login')}<div style="display:flex;background:var(--card);border-radius:99px;padding:4px;margin-bottom:16px">${['الهاتف','البريد'].map((t,i)=>`<button style="flex:1;height:40px;border-radius:99px;text-align:center;${f==i?'background:var(--pr)':'color:var(--tx2)'}" onclick="S.fg=${i};S.fs=0;draw()">${t}</button>`).join('')}</div>${fld(f?'mail':'phone',f?'البريد الإلكتروني':'رقم الهاتف')}${S.fs?`<div class="card" style="padding:14px;margin:6px 0 14px;font-size:13px;display:flex;gap:10px">${ic('info',20)}إن كان الحساب موجودًا فقد أرسلنا لك تعليمات الاستعادة.</div><button class="btn" onclick="go('newpw')">لدي الرمز</button>`:`<button class="btn" onclick="S.fs=1;draw()">إرسال رمز الاستعادة</button>`}<button style="color:var(--tq);display:block;margin:16px auto" onclick="go('login')">العودة لتسجيل الدخول</button></div>`},
newpw:()=>{const m=S.pm;if(S.pwok)return `<div class="scr" style="text-align:center;padding-top:80px"><div class="av" style="width:96px;height:96px;margin:auto;background:#3ddc9733;color:var(--ok)">${ic('check',48)}</div><h1 style="font-size:22px;margin:14px 0 24px">تم حفظ كلمة المرور</h1><button class="btn" onclick="S.pwok=0;go('login')">العودة لتسجيل الدخول</button></div>`;return `<div class="scr">${hd('كلمة مرور جديدة','forgot')}${fld('lock','كلمة المرور الجديدة',0,'password','Aa123456',1)}<div style="display:flex;gap:4px;margin-bottom:4px">${[1,1,1,0].map((x,i)=>`<i style="flex:1;height:5px;border-radius:9px;background:${x?['#FF5470','#FFB020','#3DDC97'][i]:'var(--bd)'}"></i>`).join('')}</div><p class="mut" style="margin-bottom:14px">القوة: جيدة</p>${fld('lock','تأكيد كلمة المرور',m?'كلمتا المرور غير متطابقتين':0,'password',m?'Aa12345':'Aa123456')}<button class="chip" onclick="S.pm=!S.pm;draw()">تبديل حالة عدم التطابق</button><button class="btn" style="margin-top:16px" ${m?'disabled':''} onclick="S.pwok=1;draw()">حفظ كلمة المرور</button></div>`},
username:()=>{const u=S.us||0,st=[['متاح','var(--ok)'],['محجوز، جرّب اسمًا بديلًا','var(--err)'],['اسم غير مسموح','var(--err)'],['طويل جدًا (31/30)','var(--err)']][u],nm=['سامي','نور','admin','اسم طويل جدًا جدًا'][u];return `<div class="scr" style="text-align:center">${hd('اختر اسمك','email')}<div style="display:inline-block;border-radius:50%;padding:4px;background:var(--grad)">${av(nm,0,92)}</div>${sw('us',['متاح','محجوز','غير مسموح','طويل'])}<label class="inp" style="border-color:${u?'var(--err)':'var(--ok)'}">${ic('user',20)}<input value="${nm}"></label><p style="color:${st[1]};font-size:13px;text-align:start;margin:-6px 4px 12px">${st[0]}</p>${u==1?`<div class="chips">${['نور_٢٢','نور.صوت','نورالسهر'].map(x=>`<button class="chip" onclick="S.us=0;draw()">${x}</button>`).join('')}</div>`:''}<div class="card" style="padding:12px;display:flex;align-items:center;gap:10px;margin:8px 0 18px">${av(nm,0,40)}<div style="text-align:start;flex:1"><b>${nm}</b><div class="mut">كما سيظهر على المقعد</div></div><span style="color:var(--tq)">${ic('mic',20)}</span></div><button class="btn" ${u?'disabled':''} onclick="go('setup')">متابعة</button></div>`},
setup:()=>{const I=S.it||[],T=[['music','موسيقى'],['game','ألعاب'],['chat','دردشة'],['globe','لغات'],['users','تعارف'],['book','ثقافة']];return `<div class="scr">${hd('ملفك الشخصي','username',100)}<div style="text-align:center;position:relative">${av('سامي',0,96)}<span class="rb" style="width:34px;height:34px;position:absolute;top:62px;right:calc(50% - 56px);background:var(--pr)">${ic('camera',17)}</span><div><button class="mut" style="min-height:44px">تخطي</button></div></div><div class="inp">${ic('cal',20)}<span style="flex:1">تاريخ الميلاد</span><span class="mut">01/01/2000</span></div><p class="mut" style="margin:-6px 4px 14px">لا يُعرض علنًا</p><h2 style="margin-bottom:8px">اهتماماتك</h2><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">${T.map((t,i)=>`<button class="chip ${I.includes(i)?'on':''}" onclick="tg(${i})">${ic(t[0],16)}${t[1]}</button>`).join('')}</div><div class="inp">${ic('globe',20)}<span style="flex:1">لغة التواصل</span><span>العربية</span>${ic('down',16)}</div><button class="btn" ${I.length?'':'disabled'} onclick="tab('home')">إنهاء الإعداد</button></div>`},

live:()=>{const v=S.lv||0;return `<div class="scr">${tbar('مباشر الآن','home','<button class="rb" onclick="toast(\'تم التحديث\')">'+ic('refresh',20)+'</button>')}<span class="live" style="margin-bottom:6px"><i></i>بث مباشر</span>${sw('lv',['عادي','تحميل','فارغ','خطأ','انتهت'])}${v==1?sk(4):v==2?emp('mic','لا توجد غرف مباشرة الآن','أنشئ غرفة'):v==3?`<div style="text-align:center;padding:40px;color:var(--tx2)">${ic('cloudoff',44)}<p style="margin:10px 0 14px">تعذر الاتصال</p><button class="chip on" onclick="S.lv=0;draw()">إعادة المحاولة</button></div>`:R.slice(0,4).map((r,i)=>v==4&&i==1?`<div class="card rowc" style="opacity:.45;filter:grayscale(1)">${grad(r,64,64)}<div style="flex:1"><b>${r[0]}</b><div class="mut">أُغلقت أثناء التصفح</div></div><span class="chip" style="min-height:28px;padding:2px 10px">انتهت</span></div>`:rowc(r)).join('')}</div>`},
trend:()=>{const p=S.tp||0,md=['#FFC857','#C0C7D6','#CD7F32'];return `<div class="scr">${tbar('الغرف الرائجة','home','<button class="rb" onclick="S.ti=!S.ti;draw()">'+ic('info',20)+'</button>')}${sw('tp',['اليوم','الأسبوع'])}${S.ti?`<div class="card" style="padding:12px;margin-bottom:12px;font-size:13px;color:var(--tx2);line-height:1.8">يعتمد الترتيب على نشاط الغرفة وتفاعل المستمعين، ولا يعتمد على الهدايا وحدها.</div>`:''}${[...R].sort((a,b)=>p?a[3]-b[3]:b[3]-a[3]).slice(0,5).map((r,i)=>`<button class="card rowc" onclick="rm()"><span style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;${i<3?`background:${md[i]};color:#222`:'background:var(--el)'}">${i+1}</span>${grad(r,52,52)}<div style="flex:1"><b style="font-size:14px">${r[0]}</b><div class="mut" style="display:flex;gap:6px;align-items:center;margin-top:3px">${av(P[r[4]],r[4],18)}${P[r[4]]}</div></div><div style="width:46px;height:6px;border-radius:9px;background:var(--el)"><i style="display:block;height:100%;width:${40+r[3]}%;max-width:100%;border-radius:9px;background:linear-gradient(90deg,#FFB020,#FF5470)"></i></div></button>`).join('')}</div>`},
